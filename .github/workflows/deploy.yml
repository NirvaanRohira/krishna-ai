name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify   # nothing reaches production unless lint, types, tests, audit and build pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel Production
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_HDBMNUIArjREK3pj3ICvECjZ
          VERCEL_PROJECT_ID: prj_4ZH8xAD96U1XNx7QXpeRCgzliSEb
