name: Android

# Builds and tests the Android app (mobile/android) whenever it, or this workflow, changes.
# GitHub's Ubuntu runners come with the Android SDK, so the app module builds here; the shared
# :core module (API client, models, rules) is tested on every run.
on:
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  push:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Shared logic tests (:core)
        run: ./gradlew :core:test --console=plain
      - name: Build the app (debug) and run Android lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - name: Keep the debug APK (install on a phone to try it)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kanha-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
